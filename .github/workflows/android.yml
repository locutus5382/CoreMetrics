name: CoreMetrics v0.9.9.4 Pre-Odin Validation CI
on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'design/**']
  pull_request:
    branches: [main, 'feature/**', 'fix/**', 'design/**']
  workflow_dispatch:
concurrency:
  group: coremetrics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Unit tests and assemble unified APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:assembleOptimizedTest --no-daemon
      - name: Upload unified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CoreMetrics-v0.9.9.4-pre-odin-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload R8-optimized installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: CoreMetrics-v0.9.9.4-pre-odin-optimized-test
          path: app/build/outputs/apk/optimizedTest/app-optimizedTest.apk
      - name: Preserve JVM unit test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CoreMetrics-v0994-jvm-test-failures
          if-no-files-found: ignore
          retention-days: 14
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/

  android-instrumentation:
    name: API 33 emulator integration and migration tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Run Android instrumentation on API 33 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          # Prevent stalled on-device instrumentation from hanging until
          # the outer job timeout. Preserve any generated XML/HTML reports.
          script: timeout --signal=TERM --kill-after=20s 20m gradle :app:connectedDebugAndroidTest --no-daemon
      - name: Preserve Android instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CoreMetrics-v0994-android-emulator-test-results
          if-no-files-found: ignore
          retention-days: 14
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
