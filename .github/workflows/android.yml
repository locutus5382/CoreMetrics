name: CoreMetrics Android debug build
on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'design/**']
  pull_request:
    branches: [main, 'feature/**', 'fix/**', 'design/**']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Unit tests and assemble debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleV088base :app:assembleV088themes --no-daemon
      - name: Upload v0.8.8 Frosted APK
        uses: actions/upload-artifact@v4
        with:
          name: CoreMetrics-v0.8.8-frosted
          path: app/build/outputs/apk/v088base/app-v088base.apk
      - name: Upload v0.8.8 Themes APK
        uses: actions/upload-artifact@v4
        with:
          name: CoreMetrics-v0.8.8-themes
          path: app/build/outputs/apk/v088themes/app-v088themes.apk
